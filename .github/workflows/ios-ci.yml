name: iOS CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ios-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Offline architecture guardrail
        run: |
          echo "Checking for network code in production sources..."
          VIOLATIONS=""
          if grep -r "URLSession" --include="*.swift" RediM8/App RediM8/Core RediM8/Features RediM8/Models RediM8/Services RediM8/Systems RediM8/Utilities RediM8/Views; then
            VIOLATIONS="${VIOLATIONS}URLSession found in production code\n"
          fi
          if grep -rE "^import (Firebase|Sentry|Amplitude|Mixpanel|Segment)" --include="*.swift" RediM8/; then
            VIOLATIONS="${VIOLATIONS}Banned analytics/crash SDK import found\n"
          fi
          if grep -r "BGAppRefreshTask" --include="*.swift" RediM8/; then
            VIOLATIONS="${VIOLATIONS}Background fetch task found\n"
          fi
          if grep -r "CLGeocoder" --include="*.swift" RediM8/; then
            VIOLATIONS="${VIOLATIONS}CLGeocoder (network geocoding) found\n"
          fi
          if [ -n "$VIOLATIONS" ]; then
            echo "❌ OFFLINE ARCHITECTURE VIOLATION"
            echo -e "$VIOLATIONS"
            exit 1
          fi
          echo "✅ Offline architecture check passed"

      - name: Build
        run: >
          xcodebuild
          -project RediM8.xcodeproj
          -scheme RediM8
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO
          build

      - name: Test
        run: |
          chmod +x scripts/run-ios-tests.sh
          DESTINATION='platform=iOS Simulator,name=iPhone 16e,OS=26.2' scripts/run-ios-tests.sh
        env:
          ENABLE_CODE_COVERAGE: YES

      - name: Collect code coverage
        if: always()
        run: |
          RESULT_BUNDLE=$(find ~/Library/Developer/Xcode/DerivedData -name "*.xcresult" -maxdepth 3 2>/dev/null | head -1)
          if [ -n "$RESULT_BUNDLE" ]; then
            echo "### Code Coverage Summary" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            xcrun xccov view --report --only-targets "$RESULT_BUNDLE" 2>/dev/null >> $GITHUB_STEP_SUMMARY || echo "Coverage data not available" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          else
            echo "No xcresult bundle found" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            ~/Library/Developer/Xcode/DerivedData/**/Logs/Test/*.xcresult
          retention-days: 7
          if-no-files-found: ignore
